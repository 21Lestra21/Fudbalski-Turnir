<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Live</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0f19;
color:white;
}

header{
background:#111827;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:30px;
font-weight:bold;
color:#00ff99;
}

.menu{
display:flex;
gap:20px;
}

.menu a{
color:white;
text-decoration:none;
}

.container{
padding:30px;
}

.league{
margin-bottom:40px;
}

.league-title{
font-size:25px;
margin-bottom:20px;
color:#00ff99;
}

.match{
background:#111827;
padding:20px;
border-radius:15px;
margin-bottom:15px;
display:flex;
justify-content:space-between;
align-items:center;
transition:0.3s;
}

.match:hover{
transform:scale(1.02);
}

.teams{
font-size:20px;
}

.score{
font-size:28px;
font-weight:bold;
color:#00ff99;
}

.live{
background:red;
padding:5px 10px;
border-radius:8px;
font-size:12px;
font-weight:bold;
}

</style>
</head>

<body>

<header>
<div class="logo">⚽ Football Live</div>

<div class="menu">
<a href="#">Home</a>
<a href="#">Matches</a>
<a href="#">Leagues</a>
<a href="#">Stats</a>
</div>
</header>

<div class="container">

<div class="league">
<div class="league-title">🇪🇸 La Liga</div>

<div class="match">
<div class="teams">
Barcelona vs Real Madrid
</div>

<div class="score">
2 - 1
</div>

<div class="live">
LIVE
</div>
</div>

<div class="match">
<div class="teams">
Atletico Madrid vs Sevilla
</div>

<div class="score">
20:45
</div>
</div>

</div>

<div class="league">
<div class="league-title">🏴 Premier League</div>

<div class="match">
<div class="teams">
Arsenal vs Liverpool
</div>

<div class="score">
1 - 1
</div>

<div class="live">
LIVE
</div>
</div>

<div class="match">
<div class="teams">
Chelsea vs Manchester City
</div>

<div class="score">
18:30
</div>
</div>

</div>

</div>

</body>
</html>
